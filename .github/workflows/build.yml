name: Build and deploy WebAssembly app

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Validate renderer JavaScript syntax
        run: node --check src/OpenRails.Web/wwwroot/js/route-terrain-renderer.js && node --check src/OpenRails.Web/wwwroot/js/train-driving-gamepad.js

      - name: Run gamepad reader unit tests
        run: node tests/gamepad-reader.test.mjs

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore controller tests
        run: dotnet restore tests/OpenRails.Web.Tests/OpenRails.Web.Tests.csproj

      - name: Run controller regression tests
        run: dotnet test tests/OpenRails.Web.Tests/OpenRails.Web.Tests.csproj --configuration Release --no-restore

      - name: Restore WebAssembly app
        run: dotnet restore src/OpenRails.Web/OpenRails.Web.csproj

      - name: Publish WebAssembly app
        run: dotnet publish src/OpenRails.Web/OpenRails.Web.csproj --configuration Release --no-restore --output artifacts/publish

      - name: Set GitHub Pages base path
        run: sed -i 's|<base href="/" />|<base href="/PortedOpenRails/" />|' artifacts/publish/wwwroot/index.html

      - name: Upload Pages artifact
        if: github.event_name == 'push'
        uses: actions/upload-pages-artifact@v3
        with:
          path: artifacts/publish/wwwroot

  deploy:
    if: github.event_name == 'push'
    needs: test-and-build
    concurrency:
      group: portedopenrails-pages
      cancel-in-progress: false
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
