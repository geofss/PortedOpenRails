name: Build WebAssembly app

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore src/OpenRails.Web/OpenRails.Web.csproj

      - name: Build
        run: dotnet build src/OpenRails.Web/OpenRails.Web.csproj --no-restore
