name: Route pipeline regression tests

on:
  workflow_dispatch:
  push:
    branches: [main, "port/upstream-core-files"]
    paths:
      - "src/OpenRails.Web/Parsing/**"
      - "src/OpenRails.Web/Simulation/TrackNetwork*.cs"
      - "tests/OpenRails.Web.Tests/**"
      - ".github/workflows/route-tests.yml"
  pull_request:
    branches: [main]
    paths:
      - "src/OpenRails.Web/Parsing/**"
      - "src/OpenRails.Web/Simulation/TrackNetwork*.cs"
      - "tests/OpenRails.Web.Tests/**"
      - ".github/workflows/route-tests.yml"

permissions:
  contents: read

jobs:
  route-regressions:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore route test dependencies
        run: dotnet restore tests/OpenRails.Web.Tests/OpenRails.Web.Tests.csproj

      - name: Run route parsing, geometry, terrain, and scenery regressions
        run: >-
          dotnet test tests/OpenRails.Web.Tests/OpenRails.Web.Tests.csproj
          --configuration Release
          --no-restore
          --filter
          "FullyQualifiedName~RouteLoaderTests|FullyQualifiedName~RouteAssetLocatorTests|FullyQualifiedName~RouteMetadataReaderTests|FullyQualifiedName~RouteTerrainTileLocatorTests|FullyQualifiedName~RouteWorldTileLoaderTests|FullyQualifiedName~RouteWorldTileLocatorTests|FullyQualifiedName~TerrainMeshBuilderTests|FullyQualifiedName~TerrainPatchMaterialBuilderTests|FullyQualifiedName~TerrainRawFileReadersTests|FullyQualifiedName~TerrainTextureAssetLocatorTests|FullyQualifiedName~TerrainTileReaderTests|FullyQualifiedName~TerrainTileSampleResolverTests|FullyQualifiedName~TrackDatabaseReaderTests|FullyQualifiedName~TrackGeometryTessellatorTests|FullyQualifiedName~TrackNetworkRouteBuilderTests|FullyQualifiedName~TrackNetworkBuilderTests|FullyQualifiedName~TrackNetworkRouteProfileTests|FullyQualifiedName~TrackSectionGeometryReaderTests|FullyQualifiedName~WorldShapeAssetLocatorTests|FullyQualifiedName~WorldTileReaderTests|FullyQualifiedName~AceTextureReaderTests|FullyQualifiedName~RollingStockTextureAssetLocatorTests|FullyQualifiedName~RollingStockTrackPlacementBuilderTests|FullyQualifiedName~TrackShapeAssetLocatorTests|FullyQualifiedName~TrackShapeFileReaderTests|FullyQualifiedName~TrackShapeMeshBuilderTests|FullyQualifiedName~TrackShapePlacementBuilderTests|FullyQualifiedName~TrackShapeRenderGeometryBuilderTests|FullyQualifiedName~TrackShapeTextureAssetLoaderTests|FullyQualifiedName~TrackShapeTextureAssetLocatorTests|FullyQualifiedName~WorldSceneryRenderGeometryBuilderTests|FullyQualifiedName~WorldSceneryTileLoaderTests"
